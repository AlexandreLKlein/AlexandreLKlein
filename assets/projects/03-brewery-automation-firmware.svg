<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220" role="img"
    aria-label="Brewery Automation Firmware — PID Control &amp; Recipe Execution">
    <defs>
        <linearGradient id="brewfw-bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0d1117" />
            <stop offset="100%" stop-color="#1a1f2e" />
        </linearGradient>
    </defs>
    <rect width="400" height="220" rx="12" fill="url(#brewfw-bg)" stroke="#30363d" stroke-width="1" />
    <rect x="0" y="0" width="400" height="4" rx="2" fill="#7ee787" />

    <text x="20" y="40" font-family="Segoe UI, system-ui, sans-serif" font-size="18"
        font-weight="700" fill="#f0f6fc">Brewery Automation Firmware</text>
    <text x="20" y="60" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#8b949e">PID Control &amp; Recipe Execution</text>

    <text x="20" y="95" font-family="Segoe UI, system-ui, sans-serif" font-size="11"
        font-weight="600" fill="#7ee787">SIDE PROJECT</text>

    <text x="20" y="130" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#c9d1d9">
        <tspan x="20" dy="0">Embedded firmware for automated</tspan>
        <tspan x="20" dy="16">brewing — PID temperature control and</tspan>
        <tspan x="20" dy="16">recipe execution on an 8-bit MCU.</tspan>
    </text>

    <g transform="translate(20, 192)" font-family="Segoe UI, system-ui, sans-serif" font-size="10"
        font-weight="600">
        <rect width="90" height="18" rx="3" fill="#7ee787" fill-opacity="0.15" stroke="#7ee787" />
        <text x="45" y="13" text-anchor="middle" fill="#7ee787">PID Control</text>
        <g transform="translate(96,0)">
            <rect width="70" height="18" rx="3" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff" />
            <text x="35" y="13" text-anchor="middle" fill="#79c0ff">Firmware</text>
        </g>
        <g transform="translate(172,0)">
            <rect width="78" height="18" rx="3" fill="#f0883e" fill-opacity="0.12" stroke="#f0883e" />
            <text x="39" y="13" text-anchor="middle" fill="#ffa657">8-bit MCU</text>
        </g>
    </g>
</svg>
